# ============================================================
# Group config — EDIT ME (one per group). Values here override
# the track defaults loaded from `track_config`.
# ============================================================
group_id: pickbua # e.g. G07
owner: "Nguyen Thai Duc (Lead)" # mandatory for every Decision
track_config: tracks/t02.yaml # pick your challenge: tracks/t01.yaml ... tracks/t14.yaml
track: t02 # must match track_config
input: fixtures/t02_raw_qc # or data/real/... if your instructor provided a real pack
output: out/
seed: 42
offline: true # demo/eval must not touch the network
strict_provenance: true # fail if manifest.csv hashes do not match

# Track params (merged over track_config.params). Freeze before evaluation.
# FROZEN 2026-11-15 before any eval run and before the human review of the top-20.
# Values = the sigmoid PoC thresholds of src/pipeline.py::process(); no tuning on the eval split.
params:
  target_side: 360 # images resized so the longer side <= 360 px
  blur_t_cam_a: 55.0 # gradient-variance threshold, cam_A
  blur_t_cam_b: 40.0 # gradient-variance threshold, cam_B (soft optics)
  blur_slope: 0.08
  dark_mean_day: 35.0 # mean-gray pivot, day / dusk
  dark_mean_night: 14.0 # mean-gray pivot, night
  glare_sat_day: 0.0040 # saturated-pixel fraction pivot, day / dusk
  glare_sat_night: 0.0020 # saturated-pixel fraction pivot, night
  comp_center: 1.65 # 8x8 blockiness pivot
  flag_threshold: 0.25 # top defect probability >= threshold -> RECAPTURE
